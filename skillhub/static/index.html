<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SkillHub - Hermes Agent Skills Registry</title>
    <link rel="stylesheet" href="/ui/css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/ui/" class="nav-brand">SkillHub</a>
            <span class="nav-tagline" id="tagline">Hermes Agent 技能注册中心</span>
            <div class="nav-links">
                <a href="/ui/" class="nav-link active">技能市场</a>
                <a href="/ui/admin.html" class="nav-link nav-admin hidden" id="nav-admin">后端管理</a>
            </div>
            <div class="nav-actions">
                <select id="project-filter" class="project-select hidden">
                    <option value="">所有项目</option>
                </select>
                <span id="user-status" class="user-status hidden"></span>
                <a href="/ui/login.html" class="btn btn-sm btn-outline" id="login-link">登录</a>
                <button class="btn btn-sm btn-outline hidden" id="logout-btn">退出</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Search and Filter -->
        <section class="search-section">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="搜索技能..." autocomplete="off">
                <button id="search-btn" class="btn btn-primary">搜索</button>
            </div>
            <div class="filters">
                <select id="category-filter">
                    <option value="">所有分类</option>
                </select>
                <select id="sort-filter">
                    <option value="download_count" selected>最多下载</option>
                    <option value="updated_at">最近更新</option>
                    <option value="created_at">最新</option>
                    <option value="name">名称 (A-Z)</option>
                </select>
            </div>
        </section>

        <!-- Skill List -->
        <section id="skill-list" class="skill-grid">
            <div class="loading">加载技能中...</div>
        </section>
    </main>

    <!-- Skill Detail Modal -->
    <div id="skill-modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="skill-detail"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p id="footer-text">SkillHub v0.1.0 — 轻量级 Hermes Agent 技能注册中心</p>
        </div>
    </footer>

    <script src="/ui/js/i18n.js"></script>
    <script src="/ui/js/auth.js"></script>
    <script src="/ui/js/api.js"></script>
    <script src="/ui/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 检查登录状态，更新导航栏
            const loginLink = document.getElementById('login-link');
            const logoutBtn = document.getElementById('logout-btn');
            const userStatus = document.getElementById('user-status');
            const navAdmin = document.getElementById('nav-admin');
            const projectFilter = document.getElementById('project-filter');

            if (Auth.isLoggedIn()) {
                loginLink.classList.add('hidden');
                logoutBtn.classList.remove('hidden');

                const user = Auth.getUser();
                if (user) {
                    userStatus.textContent = user.role === 'admin' ? '管理员' :
                        user.role === 'publisher' ? '发布者' : '观察者';
                    userStatus.classList.remove('hidden');
                }

                // admin 显示后端管理链接
                if (Auth.isAdmin()) {
                    navAdmin.classList.remove('hidden');
                }

                // Show project filter for logged-in users
                projectFilter.classList.remove('hidden');

                // Load projects into dropdown
                loadProjects();

                // Restore selected project from localStorage
                const savedProject = localStorage.getItem('skillhub_selected_project');
                if (savedProject) {
                    projectFilter.value = savedProject;
                }

                // Handle project selection
                projectFilter.addEventListener('change', function() {
                    const selected = this.value;
                    localStorage.setItem('skillhub_selected_project', selected);
                    // Trigger skill list refresh with project filter
                    if (typeof loadSkills === 'function') {
                        loadSkills();
                    }
                });
            } else {
                loginLink.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
            }

            // 退出登录
            logoutBtn.addEventListener('click', function() {
                Auth.logout();
                window.location.href = '/ui/login.html';
            });
        });

        async function loadProjects() {
            const projectFilter = document.getElementById('project-filter');
            try {
                const response = await Api.get('/api/projects');
                if (response.ok) {
                    const projects = await response.json();
                    // Clear existing options except "All Projects"
                    while (projectFilter.options.length > 1) {
                        projectFilter.remove(1);
                    }
                    projects.forEach(project => {
                        const option = document.createElement('option');
                        option.value = project.name;
                        option.textContent = project.display_name || project.name;
                        projectFilter.appendChild(option);
                    });
                }
            } catch (e) {
                console.error('Failed to load projects:', e);
            }
        }
    </script>
</body>
</html>
